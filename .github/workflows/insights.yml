name: Collect Repository Insights

on:
  schedule:
    # Runs every Sunday at 1am UTC
    - cron: "0 1 * * 0"
  workflow_dispatch:

jobs:
  collect-insights:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: insights
          fetch-depth: 0

      - name: Ensure 'insights' branch exists
        run: |
          git fetch origin insights || echo "No 'insights' branch found"
          git checkout insights || git checkout -b insights

      - name: Collect GitHub repo insights
        uses: emillg/github-repo-insights@v1.2.1
        with:
          repos: "kruthis123/github-context-tools,kruthis123/node-cluster-sqs-consumer,kruthis123/git-unified-diff-parse"
          pat-token: ${{ secrets.PAT_TOKEN }}

      - name: Collect PyPI stats — github-context-tools
        uses: ysskrishna/pypi-package-stats-action@v1
        with:
          package-name: github-context-tools
          output-path: docs/data/pypi_github-context-tools.json

      - name: Collect PyPI stats — git-unified-diff-parse
        uses: ysskrishna/pypi-package-stats-action@v1
        with:
          package-name: git-unified-diff-parse
          output-path: docs/data/pypi_git-unified-diff-parse.json

      - name: Collect npm stats — node-cluster-sqs-consumer
        run: |
          mkdir -p docs/data
          curl -sf "https://api.npmjs.org/downloads/point/last-day/node-cluster-sqs-consumer"   | jq '{last_day: .downloads}'   > /tmp/npm_day.json
          curl -sf "https://api.npmjs.org/downloads/point/last-week/node-cluster-sqs-consumer"  | jq '{last_week: .downloads}'  > /tmp/npm_week.json
          curl -sf "https://api.npmjs.org/downloads/point/last-month/node-cluster-sqs-consumer" | jq '{last_month: .downloads}' > /tmp/npm_month.json
          jq -s '.[0] * .[1] * .[2]' /tmp/npm_day.json /tmp/npm_week.json /tmp/npm_month.json \
            > docs/data/npm_node-cluster-sqs-consumer.json

      - name: Archive PyPI and npm snapshots by date
        run: |
          DATE=$(date -u +%Y%m%d)
          sudo chmod -R 777 docs/data/raw/
          mkdir -p docs/data/raw/$DATE
          cp docs/data/pypi_github-context-tools.json   docs/data/raw/$DATE/pypi_github-context-tools.json
          cp docs/data/pypi_git-unified-diff-parse.json  docs/data/raw/$DATE/pypi_git-unified-diff-parse.json
          cp docs/data/npm_node-cluster-sqs-consumer.json docs/data/raw/$DATE/npm_node-cluster-sqs-consumer.json
          # Update index.json with all dated folders sorted ascending
          DATES=$(ls docs/data/raw/ | grep -E '^[0-9]{8}$' | sort | jq -R . | jq -sc .)
          echo "{\"dates\": $DATES}" > docs/data/raw/index.json

      - name: Commit and push insights data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- docs/index.html
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub, PyPI and npm insights"
            git push origin insights
          fi
