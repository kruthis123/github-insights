<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kruthi Shiva Kumar's Repository Insights</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --text-muted: #7d8590;
        --accent: #58a6ff;
        --accent2: #3fb950;
        --purple: #bc8cff;
        --orange: #ffa657;
        --pypi-color: #3572a5;
        --npm-color: #cb3837;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      header {
        padding: 40px 40px 32px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .header-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .header-left h1 {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, var(--accent), var(--purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .header-left p {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-top: 6px;
      }

      .github-link {
        color: var(--accent);
        text-decoration: none;
        font-size: 0.8rem;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        transition: border-color 0.2s;
      }

      .github-link:hover { border-color: var(--accent); }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 40px 64px;
      }

      /* Section heading (Python / Node.js) */
      .ecosystem-section { margin-bottom: 64px; }

      .ecosystem-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }

      .ecosystem-heading h2 {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text);
      }

      .eco-badge {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 3px 10px;
        border-radius: 20px;
      }

      .eco-badge.pypi {
        background: rgba(53, 114, 165, 0.15);
        color: #79b8ff;
        border: 1px solid rgba(53, 114, 165, 0.4);
      }

      .eco-badge.npm {
        background: rgba(203, 56, 55, 0.12);
        color: #ff7b72;
        border: 1px solid rgba(203, 56, 55, 0.35);
      }

      /* Individual repo card */
      .repo-section { margin-bottom: 48px; }

      .repo-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .repo-header h3 {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .repo-header h3::before {
        content: "";
        display: inline-block;
        width: 3px;
        height: 16px;
        background: linear-gradient(to bottom, var(--accent), var(--purple));
        border-radius: 2px;
        flex-shrink: 0;
      }

      .repo-links { display: flex; gap: 8px; }

      .repo-links a {
        color: var(--accent);
        text-decoration: none;
        font-size: 0.78rem;
        opacity: 0.8;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        transition: all 0.2s;
      }

      .repo-links a:hover { opacity: 1; border-color: var(--accent); }

      .repo-links a.pypi-link { color: #79b8ff; }
      .repo-links a.pypi-link:hover { border-color: #79b8ff; }
      .repo-links a.npm-link  { color: #ff7b72; }
      .repo-links a.npm-link:hover  { border-color: #ff7b72; }

      /* Stats grid */
      .stats-block { margin-bottom: 14px; }

      .stats-block-label {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--text-muted);
        margin-bottom: 8px;
        font-weight: 600;
      }

      .stat-row {
        display: grid;
        gap: 10px;
        margin-bottom: 10px;
      }

      .stat-row.cols-4 { grid-template-columns: repeat(4, 1fr); }
      .stat-row.cols-3 { grid-template-columns: repeat(3, 1fr); }

      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        position: relative;
        overflow: hidden;
        transition: border-color 0.2s;
      }

      .stat:hover { border-color: rgba(88,166,255,0.35); }

      .stat::after {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
      }

      .stat-row.gh .stat:nth-child(1)::after { background: linear-gradient(to right, var(--accent), #1f6feb); }
      .stat-row.gh .stat:nth-child(2)::after { background: linear-gradient(to right, var(--accent2), #238636); }
      .stat-row.gh .stat:nth-child(3)::after { background: linear-gradient(to right, var(--purple), #8250df); }
      .stat-row.gh .stat:nth-child(4)::after { background: linear-gradient(to right, var(--orange), #d4a72c); }

      .stat-row.pkg .stat:nth-child(1)::after { background: linear-gradient(to right, #79b8ff, #58a6ff); }
      .stat-row.pkg .stat:nth-child(2)::after { background: linear-gradient(to right, var(--accent2), #238636); }
      .stat-row.pkg .stat:nth-child(3)::after { background: linear-gradient(to right, var(--orange), #d4a72c); }

      .stat-row.npm-pkg .stat:nth-child(1)::after { background: linear-gradient(to right, #ff7b72, #cb3837); }
      .stat-row.npm-pkg .stat:nth-child(2)::after { background: linear-gradient(to right, var(--orange), #d4a72c); }
      .stat-row.npm-pkg .stat:nth-child(3)::after { background: linear-gradient(to right, var(--purple), #8250df); }

      .stat .value {
        font-size: 1.7rem;
        font-weight: 700;
        line-height: 1;
        color: var(--text);
        letter-spacing: -0.5px;
      }

      .stat .label {
        font-size: 0.68rem;
        color: var(--text-muted);
        margin-top: 5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Charts */
      .charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }

      .chart-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
      }

      .chart-card h4 {
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
      }

      /* Referrals / breakdown tables */
      .table-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 10px;
      }

      .table-card h4 {
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
      }

      .table-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.82rem;
      }

      .table-row:last-child { border-bottom: none; }

      .table-row-meta { display: flex; gap: 6px; align-items: center; }

      .badge {
        background: rgba(88, 166, 255, 0.1);
        color: var(--accent);
        border: 1px solid rgba(88, 166, 255, 0.2);
        border-radius: 20px;
        padding: 2px 8px;
        font-size: 0.68rem;
        font-weight: 600;
      }

      .badge-green {
        background: rgba(63, 185, 80, 0.1);
        color: var(--accent2);
        border: 1px solid rgba(63, 185, 80, 0.2);
        border-radius: 20px;
        padding: 2px 8px;
        font-size: 0.68rem;
        font-weight: 600;
      }

      .pct-bar-wrap {
        width: 60px;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        overflow: hidden;
      }

      .pct-bar { height: 100%; border-radius: 2px; background: var(--accent); }

      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 40px 0;
      }

      .loading {
        color: var(--text-muted);
        font-size: 0.9rem;
        padding: 60px 0;
        text-align: center;
      }

      @media (max-width: 768px) {
        header { padding: 24px 20px; }
        main { padding: 24px 20px 48px; }
        .stat-row.cols-4 { grid-template-columns: repeat(2, 1fr); }
        .stat-row.cols-3 { grid-template-columns: repeat(2, 1fr); }
        .charts { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="header-left">
          <h1>Kruthi Shiva Kumar</h1>
          <p>Repository &amp; package insights &mdash; collected weekly beyond GitHub's 14-day limit</p>
        </div>
        <a class="github-link" href="https://github.com/kruthis123" target="_blank">
          &#128279; github.com/kruthis123
        </a>
      </div>
    </header>
    <main id="main"><p class="loading">Loading insights&hellip;</p></main>

    <script>
      const PYPI_REPOS = [
        { repo: "kruthis123/github-context-tools",  pkg: "github-context-tools" },
        { repo: "kruthis123/git-unified-diff-parse", pkg: "git-unified-diff-parse" },
      ];

      const NPM_REPOS = [
        { repo: "kruthis123/node-cluster-sqs-consumer", pkg: "node-cluster-sqs-consumer" },
      ];

      const CHART_OPTS = {
        responsive: true,
        plugins: {
          legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 }, color: "#7d8590", padding: 12 } },
        },
        scales: {
          x: { ticks: { font: { size: 9 }, color: "#7d8590", maxRotation: 45 }, grid: { color: "#21262d" } },
          y: { beginAtZero: true, ticks: { font: { size: 9 }, color: "#7d8590" }, grid: { color: "#21262d" } },
        },
      };

      function fileKey(repo) { return repo.replace("/", "_"); }
      function formatDate(ts) { return new Date(ts).toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
      function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n); }

      async function fetchJSON(path) {
        try {
          const res = await fetch(path);
          if (!res.ok) return null;
          return res.json();
        } catch { return null; }
      }

      function sum(arr, key) { return arr.reduce((a, b) => a + (b[key] || 0), 0); }

      function lineChart(id, labels, datasets) {
        requestAnimationFrame(() => {
          const el = document.getElementById(id);
          if (el) new Chart(el, { type: "line", data: { labels, datasets }, options: CHART_OPTS });
        });
      }

      function ghStatRow(views, clones) {
        const tv = views  ? sum(views.views,   "count")   : 0;
        const uv = views  ? sum(views.views,   "uniques") : 0;
        const tc = clones ? sum(clones.clones, "count")   : 0;
        const uc = clones ? sum(clones.clones, "uniques") : 0;
        return { tv, uv, tc, uc, score: tv + tc };
      }

      function renderGhStats(views, clones, key, container) {
        const { tv, uv, tc, uc } = ghStatRow(views, clones);

        const block = document.createElement("div");
        block.className = "stats-block";
        block.innerHTML = `<div class="stats-block-label">GitHub Traffic</div>`;

        const row = document.createElement("div");
        row.className = "stat-row cols-4 gh";
        row.innerHTML = `
          <div class="stat"><div class="value">${fmt(tv)}</div><div class="label">Total Views</div></div>
          <div class="stat"><div class="value">${fmt(uv)}</div><div class="label">Unique Visitors</div></div>
          <div class="stat"><div class="value">${fmt(tc)}</div><div class="label">Total Clones</div></div>
          <div class="stat"><div class="value">${fmt(uc)}</div><div class="label">Unique Cloners</div></div>
        `;
        block.appendChild(row);
        container.appendChild(block);

        const charts = document.createElement("div");
        charts.className = "charts";

        if (views) {
          const labels = views.views.map(v => formatDate(v.timestamp));
          const card = document.createElement("div");
          card.className = "chart-card";
          card.innerHTML = `<h4>Views over time</h4><canvas id="views-${key}"></canvas>`;
          charts.appendChild(card);
          lineChart(`views-${key}`, labels, [
            { label: "Views",  data: views.views.map(v => v.count),   borderColor: "#58a6ff", backgroundColor: "rgba(88,166,255,0.07)",  fill: true, tension: 0.4, pointRadius: 3 },
            { label: "Unique", data: views.views.map(v => v.uniques), borderColor: "#3fb950", backgroundColor: "rgba(63,185,80,0.07)",   fill: true, tension: 0.4, pointRadius: 3 },
          ]);
        }

        if (clones) {
          const labels = clones.clones.map(v => formatDate(v.timestamp));
          const card = document.createElement("div");
          card.className = "chart-card";
          card.innerHTML = `<h4>Clones over time</h4><canvas id="clones-${key}"></canvas>`;
          charts.appendChild(card);
          lineChart(`clones-${key}`, labels, [
            { label: "Clones", data: clones.clones.map(v => v.count),   borderColor: "#bc8cff", backgroundColor: "rgba(188,140,255,0.07)", fill: true, tension: 0.4, pointRadius: 3 },
            { label: "Unique", data: clones.clones.map(v => v.uniques), borderColor: "#ffa657", backgroundColor: "rgba(255,166,87,0.07)",  fill: true, tension: 0.4, pointRadius: 3 },
          ]);
        }

        container.appendChild(charts);
      }

      function renderReferrals(referrals, container) {
        if (!referrals || !referrals.length) return;
        const card = document.createElement("div");
        card.className = "table-card";
        card.innerHTML = `<h4>Traffic sources</h4>` + referrals.map(r =>
          `<div class="table-row">
            <span>${r.referrer}</span>
            <span class="table-row-meta">
              <span class="badge">${r.count} views</span>
              <span class="badge-green">${r.uniques} unique</span>
            </span>
          </div>`
        ).join("");
        container.appendChild(card);
      }

      function renderPypiStats(pypi, container) {
        if (!pypi) return;
        const d = pypi.downloads;
        const block = document.createElement("div");
        block.className = "stats-block";
        block.innerHTML = `<div class="stats-block-label">PyPI Downloads</div>`;
        const row = document.createElement("div");
        row.className = "stat-row cols-3 pkg";
        row.innerHTML = `
          <div class="stat"><div class="value">${fmt(d.last_month)}</div><div class="label">Last Month</div></div>
          <div class="stat"><div class="value">${fmt(d.last_week)}</div><div class="label">Last Week</div></div>
          <div class="stat"><div class="value">${fmt(d.last_180d)}</div><div class="label">Last 180 Days</div></div>
        `;
        block.appendChild(row);
        container.appendChild(block);
      }

      function renderNpmStats(npm, container) {
        if (!npm) return;
        const block = document.createElement("div");
        block.className = "stats-block";
        block.innerHTML = `<div class="stats-block-label">npm Downloads</div>`;
        const row = document.createElement("div");
        row.className = "stat-row cols-3 npm-pkg";
        row.innerHTML = `
          <div class="stat"><div class="value">${fmt(npm.last_month)}</div><div class="label">Last Month</div></div>
          <div class="stat"><div class="value">${fmt(npm.last_week)}</div><div class="label">Last Week</div></div>
          <div class="stat"><div class="value">${fmt(npm.last_day)}</div><div class="label">Last Day</div></div>
        `;
        block.appendChild(row);
        container.appendChild(block);
      }

      async function loadPypiRepo({ repo, pkg }) {
        const key = fileKey(repo);
        const [views, clones, referrals, pypi] = await Promise.all([
          fetchJSON(`data/${key}_views.json`),
          fetchJSON(`data/${key}_clones.json`),
          fetchJSON(`data/${key}_referrals.json`),
          fetchJSON(`data/pypi_${pkg}.json`),
        ]);
        const { score } = ghStatRow(views, clones);
        const pypiScore = pypi ? pypi.downloads.last_month : 0;
        return { repo, pkg, key, views, clones, referrals, pypi, score: score + pypiScore };
      }

      async function loadNpmRepo({ repo, pkg }) {
        const key = fileKey(repo);
        const [views, clones, referrals, npm] = await Promise.all([
          fetchJSON(`data/${key}_views.json`),
          fetchJSON(`data/${key}_clones.json`),
          fetchJSON(`data/${key}_referrals.json`),
          fetchJSON(`data/npm_${pkg}.json`),
        ]);
        const { score } = ghStatRow(views, clones);
        const npmScore = npm ? npm.last_month : 0;
        return { repo, pkg, key, views, clones, referrals, npm, score: score + npmScore };
      }

      function renderRepoSection(data, pkgType, isLast) {
        const name = data.repo.split("/")[1];
        const section = document.createElement("div");
        section.className = "repo-section";

        const pypiUrl = pkgType === "pypi" ? `https://pypi.org/project/${data.pkg}/` : null;
        const npmUrl  = pkgType === "npm"  ? `https://www.npmjs.com/package/${data.pkg}` : null;

        section.innerHTML = `
          <div class="repo-header">
            <h3>${name}</h3>
            <div class="repo-links">
              <a href="https://github.com/${data.repo}" target="_blank">GitHub &rarr;</a>
              ${pypiUrl ? `<a class="pypi-link" href="${pypiUrl}" target="_blank">PyPI &rarr;</a>` : ""}
              ${npmUrl  ? `<a class="npm-link"  href="${npmUrl}"  target="_blank">npm &rarr;</a>`  : ""}
            </div>
          </div>
        `;

        if (pkgType === "pypi") renderPypiStats(data.pypi, section);
        if (pkgType === "npm")  renderNpmStats(data.npm, section);

        renderGhStats(data.views, data.clones, data.key, section);

        if (!isLast) {
          const hr = document.createElement("hr");
          hr.className = "divider";
          section.appendChild(hr);
        }

        return section;
      }

      function ecosystemSection(title, badgeClass, repoNodes) {
        const wrap = document.createElement("div");
        wrap.className = "ecosystem-section";
        wrap.innerHTML = `
          <div class="ecosystem-heading">
            <h2>${title}</h2>
            <span class="eco-badge ${badgeClass}">${badgeClass === "pypi" ? "PyPI" : "npm"}</span>
          </div>
        `;
        repoNodes.forEach(n => wrap.appendChild(n));
        return wrap;
      }

      async function init() {
        const main = document.getElementById("main");
        main.innerHTML = "";

        const [pypiData, npmData] = await Promise.all([
          Promise.all(PYPI_REPOS.map(loadPypiRepo)),
          Promise.all(NPM_REPOS.map(loadNpmRepo)),
        ]);

        pypiData.sort((a, b) => b.score - a.score);
        npmData.sort((a, b) => b.score - a.score);

        const pypiNodes = pypiData.map((d, i) => renderRepoSection(d, "pypi", i === pypiData.length - 1));
        const npmNodes  = npmData.map((d, i)  => renderRepoSection(d, "npm",  i === npmData.length - 1));

        main.appendChild(ecosystemSection("Python Packages", "pypi", pypiNodes));
        main.appendChild(ecosystemSection("Node.js Packages", "npm", npmNodes));
      }

      init();
    </script>
  </body>
</html>
